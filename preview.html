<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuck Sudo — banner preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font:16px/1.6 ui-monospace,monospace;min-height:100vh;display:grid;place-items:center;padding:30px}main{width:min(900px,100%)}h1{font-size:24px;font-weight:500}small{color:#999}.terminal{background:#09090c;border:1px solid #35353c;border-radius:12px;padding:24px}.banner{display:flex;align-items:center;gap:35px;margin:24px 0}.banner img{width:225px;max-width:38%;image-rendering:pixelated}.copy{max-width:480px;color:#87d7ff}.tagline{color:#ffc981}button{background:#252530;border:1px solid #555;color:white;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}@media(max-width:600px){.banner{gap:15px}.terminal{padding:14px}body{padding:12px;font-size:13px}}
</style>
<main><h1>Chuck Sudo</h1><div class="terminal"><div>$ sudo -v</div><div class="banner"><img src="chuck-norris.png" alt="Chuck Norris in a fighting stance"><div class="copy"><p id="joke">Chuck Norris can power solar panels. At night.</p><p class="tagline">Chuck Norris doesn't sudo. The root user asks him for permission.</p></div></div><div>[sudo] password for user: ▌</div></div><p><button id="next">Another joke</button></p><small>Illustrative browser preview. Actual terminal size, colors, and spacing may differ.</small></main>
<script>const jokes=['Chuck Norris can power solar panels. At night.','Chuck Norris can divide by zero.','Chuck Norris counted to infinity. Twice.'];let index=0;document.getElementById('next').onclick=()=>{index=(index+1)%jokes.length;document.getElementById('joke').textContent=jokes[index]};</script></html>
